<!doctype html>
<!-- The Playgama AI intro sting: about 3 s, built from the official logo (playgama-ai-logo.svg), on a 1920x1080 stage
     scaled to the window. Plain CSS animations, no libraries. Click anywhere to play it again. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Playgama AI sting</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e10; overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #0e0e10; cursor: pointer; }
  .glow { position: absolute; }

      /* the Playgama AI logo, in parts so it can be animated: sizes and gaps from assets/playgama-ai-logo.svg */
      .glow { inset: auto; left: 50%; top: 50%; width: 1500px; height: 900px; margin: -450px 0 0 -750px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(151, 71, 255, 0.42), rgba(151, 71, 255, 0.12) 55%, rgba(151, 71, 255, 0)); }
      .badge { position: absolute; left: 50%; top: 50%; width: 1066.386px; height: 240px; margin: -120px 0 0 -533.193px;
        transform-origin: 50% 50%; }
      .pill { position: absolute; left: 0; top: 0; width: 823.605px; height: 240px; border-radius: 120px; background: #9747ff;
        overflow: hidden; transform-origin: 50% 50%; }
      .shine { position: absolute; top: -30%; bottom: -30%; left: 38%; width: 24%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0)); }
      .word { position: absolute; left: 88.511px; top: 60.226px; width: 646.599px; height: 131.958px; overflow: visible; }
      .aibox { position: absolute; left: 823.605px; top: 9.031px; width: 241.786px; height: 221.938px; transform-origin: 50% 50%; }

  /* the sting in plain CSS animations: the same times and easings as the video template (GSAP) */
  .glow { animation: glow-in 0.9s cubic-bezier(0.5, 1, 0.89, 1) 0.05s both, glow-out 0.4s cubic-bezier(0.5, 1, 0.89, 1) 2.75s forwards; }
  .pill { animation: grow 0.55s cubic-bezier(0.33, 1, 0.68, 1) 0.05s both; }
  .word { animation: wipe 0.5s cubic-bezier(0.33, 1, 0.68, 1) 0.42s both; }
  .aibox { animation: pop 0.36s cubic-bezier(0.34, 1.9, 0.64, 1) 0.92s both; }
  #aiA { animation: cut 0.01s linear 1.12s both; }
  #aiI { animation: cut 0.01s linear 1.27s both; }
  .shine { animation: sweep 0.75s cubic-bezier(0.45, 0, 0.55, 1) 1.55s both, flash 0.75s linear 1.55s both; }
  .badge { animation: fly 0.62s cubic-bezier(0.45, 0, 0.55, 1) 2.75s both; }
  @keyframes glow-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes glow-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes cut { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sweep { from { transform: translateX(-260%) skewX(-18deg); } to { transform: translateX(260%) skewX(-18deg); } }
  @keyframes flash { 0% { opacity: 0; } 49% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes fly { from { transform: translate(0, 0) scale(1); } to { transform: translate(820px, -478px) scale(0.19); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>

</div>
<script>
  // fit the 1920x1080 stage into the window; a click restarts every animation
  const fit = () => { const s = document.getElementById("stage"); s.style.transform = "scale(" + Math.min(innerWidth / 1920, innerHeight / 1080) + ")"; };
  addEventListener("resize", fit); fit();
  document.body.addEventListener("click", () => { const s = document.getElementById("stage"), c = s.cloneNode(true); s.replaceWith(c); fit(); });
</script>
</body>
</html>
